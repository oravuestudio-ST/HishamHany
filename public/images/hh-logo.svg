<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 66" fill="none">
  <!-- Left vertical -->
  <line x1="19" y1="13" x2="19" y2="53" stroke="currentColor" stroke-width="2.2"/>
  <!-- Middle vertical -->
  <line x1="50" y1="13" x2="50" y2="53" stroke="currentColor" stroke-width="2.2"/>
  <!-- Right vertical -->
  <line x1="81" y1="13" x2="81" y2="53" stroke="currentColor" stroke-width="2.2"/>

  <!-- Crossbar — runs full width, slightly below midpoint -->
  <line x1="19" y1="35" x2="81" y2="35" stroke="currentColor" stroke-width="1.6"/>

  <!-- Serifs — Left vertical top -->
  <line x1="11" y1="13" x2="27" y2="13" stroke="currentColor" stroke-width="2.2"/>
  <!-- Serifs — Left vertical bottom -->
  <line x1="11" y1="53" x2="27" y2="53" stroke="currentColor" stroke-width="2.2"/>

  <!-- Serifs — Middle vertical top -->
  <line x1="42" y1="13" x2="58" y2="13" stroke="currentColor" stroke-width="2.2"/>
  <!-- Serifs — Middle vertical bottom -->
  <line x1="42" y1="53" x2="58" y2="53" stroke="currentColor" stroke-width="2.2"/>

  <!-- Serifs — Right vertical top -->
  <line x1="73" y1="13" x2="89" y2="13" stroke="currentColor" stroke-width="2.2"/>
  <!-- Serifs — Right vertical bottom -->
  <line x1="73" y1="53" x2="89" y2="53" stroke="currentColor" stroke-width="2.2"/>
</svg>
